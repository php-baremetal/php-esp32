name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Test matrices live here, in one place.
  config:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.m.outputs.versions }}
      family_boards: ${{ steps.m.outputs.family_boards }}
      all_boards: ${{ steps.m.outputs.all_boards }}
      default_version: ${{ steps.m.outputs.default_version }}
    steps:
      - id: m
        run: |
          {
            echo 'versions=["8.3.32","8.3.33","8.4.24","8.4.25","8.5.9","8.5.10"]'
            echo 'all_boards=["esp32-p4-zero","esp32-p4-pico","esp32-p4-eth","esp32-p4-wifi-c6","esp32-s3-zero","esp32-s3-pico","esp32-s3-eth"]'
            echo 'family_boards=["esp32-p4-pico","esp32-s3-zero"]'
            echo 'default_version=8.4.25'
          } >> "$GITHUB_OUTPUT"

  # 1 — every version's manifest.toml matches the actual build wiring.
  check-manifest:
    needs: config
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.config.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check-manifest.py "${{ matrix.version }}"

  # The build jobs below share three axes instead of a full cross-product (which would be
  # dozens of combos). They're heavy, so they stay off pull requests — pushes, nightly and
  # manual runs only. Each build also checks the image fits the board's app partition.

  # 2a — default version on every board: catches board-profile breakage.
  build-boards:
    needs: [config, check-manifest]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJson(needs.config.outputs.all_boards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/idf-build
        with:
          board: ${{ matrix.board }}
          version: ${{ needs.config.outputs.default_version }}

  # 2b — every version on one board per family: catches version-bump breakage, and the
  # S3-Zero (factory capped at 3456K) is where a size regression gets caught.
  build-versions:
    needs: [config, check-manifest]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.config.outputs.versions) }}
        board: ${{ fromJson(needs.config.outputs.family_boards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/idf-build
        with:
          board: ${{ matrix.board }}
          version: ${{ matrix.version }}

  # 2c — two extreme configs on one loaded board: a fat build (web-server + full openssl +
  # mbstring/onig + opcache + sqlite + wifi) that stresses the link and flash, and a minimal
  # one. S3-ETH has native wifi and a 10M app partition, so both fit and stay comparable.
  build-configs:
    needs: [config, check-manifest]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimal
            web-server: 'false'
            fetch: 'false'
            exts: ''
          - name: fat
            web-server: 'true'
            fetch: 'true'
            exts: >-
              -DPHP_EXT_OPENSSL=ON -DPHP_EXT_OPENSSL_FULL=ON
              -DPHP_EXT_MBSTRING=ON -DPHP_EXT_MBSTRING_ONIG=ON
              -DPHP_EXT_OPCACHE=ON -DPHP_EXT_SQLITE=ON -DPHP_EXT_WIFI=ON
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/idf-build
        with:
          board: esp32-p4-eth
          version: ${{ needs.config.outputs.default_version }}
          web-server: ${{ matrix.web-server }}
          extensions: ${{ matrix.exts }}
          fetch-ext-sources: ${{ matrix.fetch }}

  # 3 (later) — run the image under Espressif's QEMU and check the serial banner.
  # Targets an S3 board; QEMU support for the ESP32-P4 isn't there yet.
  qemu:
    needs: [config, check-manifest]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/idf-build
        with:
          board: esp32-s3-zero
          version: ${{ needs.config.outputs.default_version }}
      - name: Boot under QEMU and show the serial log
        shell: bash
        continue-on-error: true
        run: |
          . "$IDF_PATH/export.sh"
          python "$IDF_PATH/tools/idf_tools.py" install qemu-xtensa
          . "$IDF_PATH/export.sh"
          timeout 90 idf.py qemu monitor 2>&1 | tee qemu.log || true
          grep -Eq "PHP|engine check" qemu.log && echo "banner seen" || echo "no banner yet (WIP)"
