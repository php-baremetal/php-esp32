name: idf-build
description: Fetch the PHP source, build the firmware in the IDF container, and check the image fits the board's app partition.

inputs:
  board:
    required: true
  version:
    required: true
  web-server:
    default: 'false'
  extensions:
    description: Extra -D flags, e.g. "-DPHP_EXT_SQLITE=ON -DPHP_EXT_OPENSSL=ON"
    default: ''
  fetch-ext-sources:
    description: Also fetch the SQLite and oniguruma sources (needed by the extensions above).
    default: 'false'
  network:
    description: Wired network to compile into board.c (emac | w5500); empty = none.
    default: ''

runs:
  using: composite
  steps:
    # Cache the ~20 MB tarball (immutable per version, keyed on its sha256), not the
    # extracted tree: fetch-php.sh makes the tree read-only, and restoring a read-only
    # dir from cache leaves it empty. Extraction + patching runs fresh every time (cheap).
    - name: Cache PHP tarball
      uses: actions/cache@v4
      with:
        path: .php-tarballs
        key: php-tarball-${{ inputs.version }}-${{ hashFiles(format('components/php/versions/{0}/version.env', inputs.version)) }}

    - name: Fetch and extract PHP source
      shell: bash
      env:
        PHP_TARBALL_CACHE: ${{ github.workspace }}/.php-tarballs
      run: PHP_VERSION=${{ inputs.version }} ./scripts/fetch-php.sh

    - name: Cache OpenSSL build
      if: inputs.fetch-ext-sources == 'true'
      uses: actions/cache@v4
      with:
        path: components/php/openssl-build
        key: openssl-${{ inputs.board }}-${{ hashFiles('scripts/fetch-openssl.sh') }}

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ccache-${{ inputs.board }}-${{ inputs.version }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ inputs.board }}-${{ inputs.version }}-
          ccache-${{ inputs.board }}-

    - name: Build
      shell: bash
      env:
        IDF_CCACHE_ENABLE: '1'
        CCACHE_DIR: ${{ github.workspace }}/.ccache
        # board.cmake reads this in the early requirement-expansion phase to pull the net REQUIRES.
        PHP_ESP32_NETWORK: ${{ inputs.network }}
      run: |
        . "$IDF_PATH/export.sh"
        if [ "${{ inputs.fetch-ext-sources }}" = "true" ]; then
          ./scripts/fetch-sqlite.sh
          ./scripts/fetch-oniguruma.sh
          ./scripts/fetch-openssl.sh
        fi
        mkdir -p ci-src && printf '<?php echo "ci\\n";\n' > ci-src/index.php
        # Embedded-only smoke builds drop the SD stack for the bare S3 chip/mode keys (esp32-s3/*);
        # the P4 chip keeps it (it has a card slot).
        msd=ON; case "${{ inputs.board }}" in esp32-s3/*) msd=OFF;; esac
        ws=OFF; [ "${{ inputs.web-server }}" = "true" ] && ws=ON
        netarg=""; [ -n "${{ inputs.network }}" ] && netarg="-DPHP_NETWORK=${{ inputs.network }}"
        idf.py -DBOARD=${{ inputs.board }} -DPHP_VERSION=${{ inputs.version }} \
               -DPHP_EMBED_SRC="$PWD/ci-src" -DPHP_STORAGE_MICROSD=$msd \
               -DPHP_PROJECT_WEB_SERVER=$ws $netarg ${{ inputs.extensions }} build

    - name: Check image fits the app partition
      shell: bash
      run: bash ci/check-size.sh "${{ inputs.board }}"
