# ESP32-P4-ETH board descriptor -- capabilities for flash-tool.
#
# name/family : identity.
# storage_types / project_types : the modes this board's HARDWARE supports. flash-tool
#   offers a mode only when it is BOTH listed here AND marked available (implemented) in
#   the selected PHP version's manifest
#   (components/php/versions/<version>/manifest.toml).
#
# Unlike the Pico, this board has a wired Ethernet PHY (IP101GRI), so it CAN do
# `web-server`; it is listed here as a hardware capability even though the firmware
# doesn't implement web-server yet (the manifest still marks it unavailable, so it isn't
# offered until then).
#
# network : the board's network interface -- "ethernet" | "wifi" | absent (none). A
#   board-level peripheral (external PHY / radio), which a chip probe can't see, so it's
#   declared here; `phpflash discover` reports it. The ESP32-P4 has no built-in radio.

schema_version = 1

name   = "ESP32-P4-ETH"
family = "esp32-p4"

storage_types = ["microsd", "embedded"]
project_types = ["init-loop", "event-driven", "web-server"]
network       = "ethernet"
