# Open preset for the ESP32-P4: no peripherals preset. Used when a project selects the chip
# (`[esp32] family = "esp32-p4"`) without naming a model; the project adds any peripherals itself
# (declaring type + pins, validated against the chip's capabilities). The P4 is a single-PSRAM,
# 32 MB-flash chip, so those defaults stand.
schema_version = 1
name    = "ESP32-P4 (generic)"
flash   = "32MB"
console = "uart"
