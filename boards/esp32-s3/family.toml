# ESP32-S3 chip-family descriptor -- family-level identity for tooling (flash-tool).
# The family's build config is in sdkconfig.family (next to this file); every board
# under esp32-s3/ inherits it. A new chip family is a sibling directory with its own
# family.toml + sdkconfig.family.

schema_version = 1

name   = "ESP32-S3"      # display name (also what the console banner prints)
target = "esp32s3"       # the ESP-IDF target (Xtensa LX7, dual-core)
psram  = true            # external SPI PSRAM (the runtime heap lives here)
