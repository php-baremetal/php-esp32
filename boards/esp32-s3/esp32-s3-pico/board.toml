# ESP32-S3-Pico board descriptor -- capabilities for flash-tool (a plain ESP32-S3 with a
# microSD slot and no wired network).
#
# name/family : identity.
# storage_types / project_types : the modes this board's HARDWARE supports. flash-tool
#   offers a mode only when it is BOTH listed here AND marked available (implemented) in
#   the selected PHP version's manifest
#   (components/php/versions/<version>/manifest.toml).
#
# This board has no wired Ethernet, so it does NOT advertise `web-server`; it runs the
# `init-loop` and `event-driven` sketch models. It is the S3-ETH without the W5500 -- same
# microSD-over-SPI wiring, same 16 MB flash, just no network stack.
#
# network : omitted entirely -- this board has no network interface, so `phpflash
#   discover` reports "network: none" for it. (The S3 has a Wi-Fi radio on the die, but
#   this board profile exposes no networking.)

schema_version = 1

name   = "ESP32-S3-Pico"
family = "esp32-s3"

storage_types = ["microsd", "embedded"]
project_types = ["init-loop", "event-driven"]
