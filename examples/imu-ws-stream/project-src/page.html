<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 IMU stream</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #14161a; color: #e8eaed;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
  .card { width: min(94vw, 34rem); background: #1d2026; border: 1px solid #2c303a;
          border-radius: 1rem; padding: 1.4rem; box-shadow: 0 8px 30px #0006; }
  h1 { font-size: 1.1rem; margin: 0 0 1rem; font-weight: 600; }
  h1 small { color: #8b93a1; font-weight: 400; }
  h2 { font-size: .8rem; font-weight: 600; color: #aab2c0; margin: 1rem 0 .4rem; }
  h2 span { color: #6b7280; font-weight: 400; }
  canvas { width: 100%; height: 150px; background: #0f1114; border: 1px solid #2c303a;
           border-radius: .6rem; display: block; }
  .legend { display: flex; gap: 1.1rem; margin: .5rem 0 .2rem; font-size: .8rem; font-variant-numeric: tabular-nums; }
  .legend span { display: flex; align-items: center; gap: .4rem; }
  .dot { width: .7rem; height: .7rem; border-radius: 50%; }
  .temp { margin: 1.1rem 0 .2rem; font-size: .95rem; }
  .temp b { font-variant-numeric: tabular-nums; font-size: 1.4rem; }
  .hint { margin: .9rem 0 0; font-size: .74rem; color: #6b7280; text-align: center; }
  .hint b { color: #9aa3b2; }
</style>
</head>
<body>
<div class="card">
  <h1>ESP32 QMI8658 <small>&mdash; accel + gyro + temperature, live over WebSocket</small></h1>

  <h2>Accelerometer <span>(g, &plusmn;2.5)</span></h2>
  <canvas id="plotA" width="900" height="150"></canvas>
  <div class="legend">
    <span><i class="dot" style="background:#ff6b6b"></i>X <b id="ax">0</b></span>
    <span><i class="dot" style="background:#51cf66"></i>Y <b id="ay">0</b></span>
    <span><i class="dot" style="background:#6ea8fe"></i>Z <b id="az">0</b></span>
    <span style="margin-left:auto;color:#8b93a1" id="rate">0 Hz</span>
  </div>

  <h2>Gyroscope <span>(&deg;/s, &plusmn;550)</span></h2>
  <canvas id="plotG" width="900" height="150"></canvas>
  <div class="legend">
    <span><i class="dot" style="background:#ffa94d"></i>X <b id="gx">0</b></span>
    <span><i class="dot" style="background:#da77f2"></i>Y <b id="gy">0</b></span>
    <span><i class="dot" style="background:#22b8cf"></i>Z <b id="gz">0</b></span>
  </div>

  <div class="temp">Temperature: <b id="t">--</b> &deg;C</div>

  <p class="hint" id="status"><b>connecting&hellip;</b> &mdash; polled on core 1, streamed from PHP</p>
</div>
<script src="/app.js"></script>
</body>
</html>
