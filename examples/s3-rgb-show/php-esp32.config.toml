name = "s3-rgb-show"
storage_type = "embedded"   # PHP source packed into flash
type = "init-loop"          # execution model

[board]
target = "esp32-s3-zero"    # ESP32-S3 ONLY: the onboard RGB LED is an S3 feature
port   = ""          # empty = autodetect at flash time

[esp-idf]
path    = ""
version = ""

[php-esp32]
path    = ""
version = ""

# The onboard WS2812 RGB LED extension. ESP32-S3 only -- enabling it for a P4 board
# fails the build with a clear message. The data pin defaults to 48; set it to match
# your board here.
[extensions.s3_onboard_rgb]
enabled = true
pin     = 48

[php]
src   = "project-src"      # PHP source folder (packed into the embedded image)
entry = "index.php"    # entry file within src
