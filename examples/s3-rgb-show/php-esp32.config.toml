name = "s3-rgb-show"
storage_type = "embedded"   # PHP source packed into flash
type = "init-loop"          # execution model

[board]
target = "esp32-s3-zero"    # the onboard RGB LED is on GPIO 48 here (38 on some S3 boards)
port   = ""          # empty = autodetect at flash time

[esp-idf]
path    = ""
version = ""

[php-esp32]
path    = ""
version = ""

# Addressable-LED drivers. The onboard WS2812 is driven by the ws2812 driver; the pin and
# pixel count are passed in PHP (new Ws2812(48, 1, ...)).
[extensions.led]
enabled = true
leds    = ["ws2812"]

[php]
src   = "project-src"      # PHP source folder (packed into the embedded image)
entry = "index.php"    # entry file within src
