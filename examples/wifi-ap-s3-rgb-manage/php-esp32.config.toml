name = "wifi-ap-s3-rgb-manage"
storage_type = "embedded"   # PHP source packed into flash
type = "event-driven"       # resident reactor: HTTP + WebSocket as event sources (no per-request teardown)

[board]
target = "esp32-s3-zero"    # any WiFi-capable ESP32-S3 board with the onboard RGB LED
port   = ""          # empty = autodetect at flash time

[esp-idf]
path    = ""
version = ""

[php-esp32]
path    = ""
version = ""

# WiFi from PHP. index.php creates a SoftAP so the board serves its page over WiFi -- no router.
[extensions.wifi]
enabled = true

# The onboard WS2812 RGB LED (ESP32-S3 boards only). pin 48 on the S3-Zero / most S3 dev boards.
[extensions.s3_onboard_rgb]
enabled = true
pin     = 48

# HTTP + WebSocket sources (Baremetal\Http\Request/Response/Message, serve_http/serve_ws, ws_broadcast).
[extensions.web]
enabled = true

[php]
src   = "project-src"      # PHP source folder (packed into the embedded image)
entry = "init.php"     # runs once: brings up the AP, registers listeners, starts the server
