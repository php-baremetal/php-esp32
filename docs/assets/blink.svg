<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120" role="img" aria-label="An LED on GPIO2 blinking on and off every 500 ms, driven from PHP">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- dev board -->
  <rect x="14" y="28" width="104" height="70" rx="8" fill="url(#b)" stroke="#475569" stroke-width="1.3"/>
  <!-- SoC -->
  <rect x="30" y="46" width="36" height="36" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="48" y="68" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">PHP</text>
  <!-- pin header -->
  <g fill="#64748b">
    <rect x="104" y="42" width="6" height="6" rx="1"/>
    <rect x="104" y="55" width="6" height="6" rx="1"/>
    <rect x="104" y="68" width="6" height="6" rx="1"/>
    <rect x="104" y="81" width="6" height="6" rx="1"/>
  </g>
  <text x="98" y="62" font-family="ui-monospace, monospace" font-size="8" fill="#cbd5e1" text-anchor="end">2</text>

  <!-- wire from GPIO2 to the LED -->
  <path d="M110 58 H140 a6 6 0 0 1 6 6 V78" fill="none" stroke="#f59e0b" stroke-width="1.6" opacity="0.5"/>
  <!-- resistor -->
  <rect x="140" y="66" width="12" height="14" rx="1.5" fill="none" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- LED glow -->
  <circle cx="146" cy="96" r="16" fill="#f59e0b" opacity="0.3">
    <animate attributeName="opacity" values="0.34;0.34;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="r" values="16;16;10;10" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </circle>
  <!-- LED -->
  <circle cx="146" cy="96" r="9" fill="#fbbf24" stroke="#b45309" stroke-width="1.2">
    <animate attributeName="fill" values="#fbbf24;#fbbf24;#78350f;#78350f" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </circle>
</svg>
